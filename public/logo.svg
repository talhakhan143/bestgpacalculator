<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 956 188" role="img" aria-label="BestGpaCalculator — Academic Excellence" preserveAspectRatio="xMinYMid meet">
  <title>BestGpaCalculator</title>
  <defs>
    <style>
      .wm{font-family:"Inter","Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-weight:800;letter-spacing:-0.5px}
      .tag{font-family:"Inter","Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-weight:500;letter-spacing:1px}
    </style>
  </defs>

  <!-- Graduation cap -->
  <g transform="translate(28,24)" fill="none" stroke="#3F4A5A" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- mortarboard top (rhombus) -->
    <path d="M85 4 L168 38 L85 72 L2 38 Z"/>
    <!-- mortarboard base -->
    <path d="M30 50 L30 78 C30 92 50 100 85 100 C120 100 140 92 140 78 L140 50"/>
    <!-- tassel -->
    <path d="M168 38 L168 70"/>
  </g>
  <circle cx="196" cy="96" r="6" fill="#3F4A5A"/>

  <!-- Calculator circular icon below cap -->
  <g transform="translate(58,108)">
    <circle cx="36" cy="36" r="36" fill="#3FA9F5"/>
    <!-- Inner four-button grid -->
    <g fill="#fff" font-family="Arial,sans-serif" font-weight="700" text-anchor="middle">
      <circle cx="22" cy="22" r="9" fill="#fff" fill-opacity="0.15"/>
      <text x="22" y="27" font-size="14" fill="#fff">+</text>
      <circle cx="50" cy="22" r="9" fill="#fff" fill-opacity="0.15"/>
      <text x="50" y="27" font-size="14" fill="#fff">×</text>
      <circle cx="22" cy="50" r="9" fill="#fff" fill-opacity="0.15"/>
      <text x="22" y="55" font-size="14" fill="#fff">−</text>
      <circle cx="50" cy="50" r="9" fill="#fff" fill-opacity="0.15"/>
      <text x="50" y="55" font-size="14" fill="#fff">=</text>
    </g>
  </g>

  <!-- Wordmark: Bestgpa (dark) + Calculator (blue) -->
  <text class="wm" x="230" y="108" font-size="84" fill="#3F4A5A">Bestgpa<tspan fill="#3FA9F5">Calculator</tspan></text>

  <!-- Tagline rule + Academic Excellence -->
  <line x1="232" y1="138" x2="660" y2="138" stroke="#3FA9F5" stroke-width="2"/>
  <text class="tag" x="945" y="162" font-size="22" fill="#64748B" text-anchor="end">Academic Excellence</text>
</svg>
